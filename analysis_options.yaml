include: package:flutter_lints/flutter.yaml

plugins:
  riverpod_lint: ^3.2.0

formatter:
  trailing_commas: preserve

linter:
  rules:
    prefer_const_constructors: true
    avoid_print: false

analyzer:
  exclude:
    - '**/*.g.dart'
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**